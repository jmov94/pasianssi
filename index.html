<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4a2c17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pasianssi">
  <meta name="description" content="Klondike-pasianssi, joka toimii myös ilman verkkoyhteyttä.">
  <title>Pasianssi</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="board" aria-label="Pelilauta"></main>

  <nav class="bar">
    <button id="new" type="button">Uusi peli</button>
    <button id="undo" type="button">Kumoa</button>
    <button id="sound" type="button" aria-label="Äänet" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 9h4l5-4.2v14.4l-5-4.2h-4z" fill="currentColor"/>
        <path class="waves" d="M15.5 8.6a4.8 4.8 0 0 1 0 6.8M18.2 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path class="mute" d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="info">
      <span id="moves">Siirrot 0</span>
      <span id="time">0:00</span>
    </div>
  </nav>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
      <h1 id="dlg-title">Uusi peli</h1>
      <p id="dlg-text"></p>
      <p id="dlg-stats" class="stats"></p>
      <p id="dlg-offline" class="stats"></p>
      <label class="toggle">
        <input type="checkbox" id="winnable">
        <span>Vain voitettavat jaot</span>
      </label>
      <div class="buttons">
        <button type="button" data-draw="1">Nosta 1 kortti</button>
        <button type="button" data-draw="3">Nosta 3 korttia</button>
        <button type="button" id="close" class="secondary">Peruuta</button>
      </div>
    </div>
  </div>

  <script src="jako.js"></script>
  <script src="ratkaistavat.js"></script>
  <script src="app.js"></script>
</body>
</html>
